<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currículum Vitae - Vista de Impresión</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#0284c7',
          }
        }
      }
    }
  </script>
  <style>
    @page {
      size: A4;
      margin: 12mm 15mm;
    }
    @media print {
      body {
        background: #ffffff !important;
        color: #0f172a !important;
        font-size: 9.5pt;
      }
      .no-print {
        display: none !important;
      }
      .hoja-a4 {
        box-shadow: none !important;
        margin: 0 !important;
        padding: 0 !important;
        max-width: 100% !important;
      }
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .page-break-inside-avoid {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen py-6 print:py-0 print:bg-white font-sans">

  <!-- BARRA DE ACCIONES SUPERIOR (Solo visible en pantalla) -->
  <div class="no-print fixed top-0 left-0 right-0 bg-slate-900/90 backdrop-blur-md text-white py-3 px-6 z-50 shadow-md flex justify-between items-center max-w-4xl mx-auto rounded-b-xl">
    <div class="flex items-center gap-2 text-sm font-medium">
      <i class="bi bi-file-earmark-pdf text-sky-400 text-lg"></i>
      <span>Vista previa optimizada para impresión (A4)</span>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="window.close()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors">
        Cerrar
      </button>
      <button onclick="window.print()" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-sky-500 hover:bg-sky-600 text-white shadow-lg shadow-sky-500/20 flex items-center gap-1.5 transition-all">
        <i class="bi bi-printer-fill"></i> Imprimir / Guardar PDF
      </button>
    </div>
  </div>

  <!-- CONTENEDOR TIPO HOJA A4 -->
  <main class="hoja-a4 max-w-[210mm] min-h-[297mm] mx-auto bg-white shadow-2xl p-8 sm:p-12 mt-12 print:mt-0 rounded-xl print:rounded-none">

    <!-- ENCABEZADO: FOTO Y DATOS PRINCIPALES -->
    <header class="flex flex-row items-center gap-6 pb-6 border-b-2 border-slate-200">
      <img id="printFoto" src="" alt="Foto" class="w-24 h-24 sm:w-28 sm:h-28 rounded-full object-cover border-2 border-sky-500 shadow-sm shrink-0">
      <div class="flex-1">
        <h1 id="printNombre" class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight leading-none mb-1.5"></h1>
        <p id="printTitulo" class="text-sm sm:text-base font-semibold text-sky-600 mb-3"></p>
        
        <!-- DATOS DE CONTACTO EN GRID -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-1 text-xs text-slate-600">
          <div class="flex items-center gap-1.5 truncate">
            <i class="bi bi-envelope text-sky-500"></i>
            <span id="printEmail"></span>
          </div>
          <div class="flex items-center gap-1.5 truncate">
            <i class="bi bi-telephone text-sky-500"></i>
            <span id="printTelefono"></span>
          </div>
          <div class="flex items-center gap-1.5 truncate">
            <i class="bi bi-geo-alt text-sky-500"></i>
            <span id="printUbicacion"></span>
          </div>
          <div id="printRedes" class="flex items-center gap-2 text-slate-600">
            <!-- Iconos de redes sociales -->
          </div>
        </div>
      </div>
    </header>

    <!-- CUERPO PRINCIPAL: 2 COLUMNAS -->
    <div class="grid grid-cols-12 gap-8 pt-6">

      <!-- COLUMNA PRINCIPAL / IZQUIERDA (7 cols) -->
      <section class="col-span-12 sm:col-span-7 space-y-6">
        
        <!-- SOBRE MÍ -->
        <div>
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2 mb-2">
            <i class="bi bi-person-lines-fill text-sky-600"></i> Perfil Profesional
          </h2>
          <p id="printSobreMi" class="text-xs sm:text-[13px] leading-relaxed text-slate-700 text-justify"></p>
        </div>

        <!-- EXPERIENCIA LABORAL -->
        <div>
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2 mb-3">
            <i class="bi bi-briefcase-fill text-sky-600"></i> Experiencia Laboral
          </h2>
          <div id="printExperiencias" class="space-y-4"></div>
        </div>

        <!-- PROYECTOS DESTACADOS -->
        <div>
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2 mb-3">
            <i class="bi bi-code-slash text-sky-600"></i> Proyectos
          </h2>
          <div id="printProyectos" class="space-y-3"></div>
        </div>
      </section>

      <!-- COLUMNA LATERAL / DERECHA (5 cols) -->
      <aside class="col-span-12 sm:col-span-5 space-y-6 sm:border-l sm:border-slate-200 sm:pl-6">
        
        <!-- HABILIDADES TÉCNICAS CON BARRAS SUTILES -->
        <div>
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2 mb-3">
            <i class="bi bi-tools text-sky-600"></i> Habilidades
          </h2>
          <div id="printHabilidades" class="space-y-2.5"></div>
        </div>

        <!-- FORMACIÓN Y ESTUDIOS -->
        <div>
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2 mb-3">
            <i class="bi bi-mortarboard-fill text-sky-600"></i> Educación
          </h2>
          <div id="printEducacion" class="space-y-3"></div>
        </div>
      </aside>

    </div>
  </main>

  <!-- SCRIPT PARA POBLAR LOS DATOS Y FORMATEAR -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Obtener datos guardados en localStorage
      const datosStr = localStorage.getItem('cvData');
      if (!datosStr) {
        alert("No se encontraron datos guardados en este navegador.");
        return;
      }
      const data = JSON.parse(datosStr);

      // Perfil
      const p = data.perfil || {};
      document.getElementById('printNombre').innerText = p.nombre || '';
      document.getElementById('printTitulo').innerText = p.titulo || '';
      document.getElementById('printEmail').innerText = p.email || '';
      document.getElementById('printTelefono').innerText = p.telefono || '';
      document.getElementById('printUbicacion').innerText = p.ubicacion || '';
      document.getElementById('printFoto').src = p.foto || 'https://via.placeholder.com/150';

      // Redes
      const redesCont = document.getElementById('printRedes');
      if (data.redes && data.redes.length > 0) {
        redesCont.innerHTML = data.redes.map(r => `
          <span class="inline-flex items-center gap-1 text-[11px]"><i class="bi ${r.icono} text-sky-500"></i></span>
        `).join('');
      }

      // Sobre Mí
      document.getElementById('printSobreMi').innerText = data.sobreMi || '';

      // Experiencia (invertida: la más reciente arriba)
      const expCont = document.getElementById('printExperiencias');
      const exps = [...(data.experiencias || [])].reverse();
      expCont.innerHTML = exps.map(e => `
        <div class="page-break-inside-avoid">
          <div class="flex justify-between items-baseline">
            <h3 class="text-xs font-bold text-slate-900">${e.titulo}</h3>
          </div>
          <span class="text-[11px] font-semibold text-sky-600 block mb-1">${e.subtitulo}</span>
          <p class="text-xs text-slate-600 leading-normal">${e.desc}</p>
        </div>
      `).join('');

      // Proyectos
      const proCont = document.getElementById('printProyectos');
      proCont.innerHTML = (data.proyectos || []).map(pr => `
        <div class="page-break-inside-avoid">
          <h3 class="text-xs font-bold text-slate-900">${pr.titulo}</h3>
          <span class="text-[10px] text-slate-500 block mb-0.5">${pr.subtitulo}</span>
          <p class="text-xs text-slate-600">${pr.desc}</p>
        </div>
      `).join('');

      // Habilidades con barras sutiles y porcentaje exacto pintado
      const habCont = document.getElementById('printHabilidades');
      habCont.innerHTML = (data.habilidades || []).map(h => {
        const nivel = Math.min(100, Math.max(1, parseInt(h.nivel, 10) || 50));
        return `
          <div class="page-break-inside-avoid">
            <div class="flex justify-between items-center text-xs mb-1">
              <span class="font-medium text-slate-800">${h.nombre}</span>
              <span class="text-[11px] font-bold text-sky-600">${nivel}%</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-1.5 overflow-hidden">
              <div class="bg-sky-600 h-1.5 rounded-full" style="width: ${nivel}%; background-color: #0284c7 !important;"></div>
            </div>
          </div>
        `;
      }).join('');

      // Educación
      const eduCont = document.getElementById('printEducacion');
      eduCont.innerHTML = (data.educacion || []).map(ed => `
        <div class="page-break-inside-avoid">
          <h3 class="text-xs font-bold text-slate-900">${ed.titulo}</h3>
          <span class="text-[11px] font-medium text-sky-600 block mb-0.5">${ed.subtitulo}</span>
          <p class="text-xs text-slate-600">${ed.desc}</p>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
